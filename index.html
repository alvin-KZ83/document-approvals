<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Approvals</title>
<style>
  :root{
    --bg:#F4F5FA; --surface:#FFFFFF; --ink:#1E2233; --ink-soft:#6B7086; --line:#E6E7F0;
    --primary:#5B5FEF; --primary-soft:#EEEFFE;
    --approved:#2FA36B; --rejected:#D64545; --pending:#E2A73E;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; font-size:15px; line-height:1.5;}
  .wrap{max-width:640px; margin:0 auto; padding:24px 20px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:10px;}
  header h1{font-size:19px; margin:0;}
  .who{font-size:13px; color:var(--ink-soft);}
  .badges{display:flex; gap:6px; margin-top:4px;}
  .badge{font-size:11px; border:1px solid var(--line); border-radius:20px; padding:2px 8px; color:var(--ink-soft);}
  .badge.on{color:var(--primary); border-color:var(--primary);}
  button{font:inherit; cursor:pointer;}
  .btn{background:var(--primary); color:#fff; border:1px solid var(--primary); border-radius:8px; padding:9px 16px; font-weight:600;}
  .btn.secondary{background:transparent; color:var(--primary);}
  .btn.approve{background:var(--approved); border-color:var(--approved);}
  .btn.reject{background:var(--rejected); border-color:var(--rejected);}
  .btn.small{padding:6px 12px; font-size:13px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px;}
  .card h2{font-size:15px; margin:0 0 12px;}
  label{display:block; font-size:12.5px; color:var(--ink-soft); margin:0 0 5px; font-weight:600;}
  input, select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#FAFAFE; color:var(--ink); font:inherit; margin-bottom:14px;}
  .row{display:flex; gap:6px;}
  .row input{margin-bottom:0;}
  .item{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:13.5px;}
  .item:first-of-type{border-top:none;}
  .item .meta{flex:1;}
  .item .meta .t{font-weight:600;}
  .item .meta .s{color:var(--ink-soft); font-size:12px;}
  .tag{font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; text-transform:capitalize;}
  .tag.pending{color:var(--pending); background:#FBF1DF;}
  .tag.approved{color:var(--approved); background:#E3F3EA;}
  .tag.rejected{color:var(--rejected); background:#FBE7E7;}
  .empty{color:var(--ink-soft); font-size:13.5px; padding:8px 0;}
  .error{color:var(--rejected); font-size:13px; margin:-6px 0 14px;}
  .hint{font-size:12px; color:var(--ink-soft); margin:-8px 0 14px;}
  .status-line{font-size:13px; color:var(--ink-soft); min-height:18px;}
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc, query, where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadBytes, getBytes
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let profile = null;          // { name, perm }
let approvers = [];          // directory entries with approve bit set
let myUploads = [];
let pendingApprovals = [];
let decidedByMe = [];
let loginError = '';
let statusLine = '';

const el = document.getElementById('app');

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if(user){
    await loadProfile();
  } else {
    profile = null;
    render();
  }
});

async function loadProfile(){
  const snap = await getDoc(doc(db, 'users', currentUser.uid));
  if(!snap.exists()){
    loginError = "Your account isn't set up yet. Ask your admin to add you to the directory.";
    await signOut(auth);
    return;
  }
  profile = snap.data(); // {name, perm}
  loginError = '';
  await Promise.all([loadDirectory(), loadMyUploads(), loadPendingApprovals(), loadDecidedByMe()]);
  render();
}

async function loadDirectory(){
  const snap = await getDocs(collection(db, 'users'));
  approvers = snap.docs
    .map(d => ({ uid: d.id, ...d.data() }))
    .filter(u => u.perm && u.perm[1] === '1' && u.uid !== currentUser.uid);
}

// Firestore Timestamp -> ms. A doc written this session may still have a null
// createdAt if serverTimestamp() hasn't resolved; sort those to the top.
function millis(ts){ return ts && typeof ts.toMillis === 'function' ? ts.toMillis() : Infinity; }

async function loadMyUploads(){
  if(!canUpload()) { myUploads = []; return; }
  const q = query(collection(db, 'documents'), where('uploadedByUid', '==', currentUser.uid));
  const snap = await getDocs(q);
  myUploads = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => millis(b.createdAt) - millis(a.createdAt));
}

async function loadPendingApprovals(){
  if(!canApprove()) { pendingApprovals = []; return; }
  const q = query(collection(db, 'documents'), where('approverUid', '==', currentUser.uid), where('status', '==', 'pending'));
  const snap = await getDocs(q);
  pendingApprovals = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function loadDecidedByMe(){
  if(!canApprove()) { decidedByMe = []; return; }
  const q = query(collection(db, 'documents'), where('approverUid', '==', currentUser.uid), where('status', 'in', ['approved','rejected']));
  const snap = await getDocs(q);
  decidedByMe = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function canUpload(){ return !!profile && profile.perm && profile.perm[0] === '1'; }
function canApprove(){ return !!profile && profile.perm && profile.perm[1] === '1'; }

/* ---------------- Crypto (AES-GCM, passphrase via PBKDF2) ---------------- */
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

async function deriveKey(passphrase, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 150000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptFile(file, passphrase){
  const plain = await file.arrayBuffer();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);
  return { cipher, saltB64: b64(salt), ivB64: b64(iv) };
}

async function decryptBytes(cipherBuf, passphrase, saltB64, ivB64){
  const salt = unb64(saltB64), iv = unb64(ivB64);
  const key = await deriveKey(passphrase, salt);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipherBuf); // throws on wrong passphrase
}

/* ---------------- Actions ---------------- */
async function doLogin(email, password){
  loginError = '';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch(err){
    loginError = 'Could not sign in. Check the email and password.';
    render();
  }
}

async function doLogout(){ await signOut(auth); }

async function handleUpload(e){
  e.preventDefault();
  const fileInput = document.getElementById('u-file');
  const file = fileInput.files[0];
  const title = document.getElementById('u-title').value.trim();
  const approverUid = document.getElementById('u-approver').value;
  const pass = document.getElementById('u-pass').value;

  if(!file || file.type !== 'application/pdf'){ alert('Choose a PDF file.'); return; }
  if(!approverUid){ alert('Choose who should approve this.'); return; }

  const encrypted = !!pass;
  let bytesToUpload, saltB64 = null, ivB64 = null;

  if(encrypted){
    statusLine = 'Encrypting…'; render();
    const enc = await encryptFile(file, pass);
    bytesToUpload = new Uint8Array(enc.cipher);
    saltB64 = enc.saltB64; ivB64 = enc.ivB64;
  } else {
    bytesToUpload = new Uint8Array(await file.arrayBuffer());
  }

  statusLine = 'Uploading…'; render();
  const path = `docs/${crypto.randomUUID()}${encrypted ? '.enc' : '.pdf'}`;
  // uploadedByUid/approverUid go on as custom metadata so storage.rules can gate
  // read access even when the file isn't encrypted (see storage.rules comment).
  await uploadBytes(storageRef(storage, path), bytesToUpload, {
    customMetadata: { uploadedByUid: currentUser.uid, approverUid }
  });

  const approver = approvers.find(a => a.uid === approverUid);
  await addDoc(collection(db, 'documents'), {
    title: title || file.name,
    fileName: file.name,
    sizeKB: Math.max(1, Math.round(file.size / 1024)),
    uploadedByUid: currentUser.uid,
    uploadedByName: profile.name,
    approverUid,
    approverName: approver ? approver.name : '',
    status: 'pending',
    storagePath: path,
    encrypted,
    saltB64, ivB64,
    createdAt: serverTimestamp(),
  });

  statusLine = encrypted ? 'Sent for approval.' : 'Sent for approval (unencrypted).';
  e.target.reset();
  await loadMyUploads();
  render();
}

async function decide(docId, result){
  const comment = window.prompt(result === 'rejected' ? 'Note for the uploader (required):' : 'Optional note:') || '';
  if(result === 'rejected' && !comment){ alert('A note is required when rejecting.'); return; }
  await updateDoc(doc(db, 'documents', docId), { status: result, comment, decidedAt: serverTimestamp() });
  await Promise.all([loadPendingApprovals(), loadDecidedByMe()]);
  render();
}

async function viewDocument(docId, meta){
  let pass = null;
  if(meta.encrypted){
    pass = window.prompt('Enter the document passphrase to view it:');
    if(!pass) return;
  }
  try {
    const bytes = await getBytes(storageRef(storage, meta.storagePath));
    const plain = meta.encrypted ? await decryptBytes(bytes, pass, meta.saltB64, meta.ivB64) : bytes;
    const blob = new Blob([plain], { type: 'application/pdf' });
    openPdfViewer(meta.title || meta.fileName, URL.createObjectURL(blob));
  } catch(err){
    alert(meta.encrypted ? 'Wrong passphrase, or the file could not be decrypted.' : 'Could not open the file.');
  }
}

// Two independent <iframe>s pointing at the same blob URL, side by side —
// each gets the browser's normal PDF viewer with its own scroll/zoom/page
// position, so a reviewer can park one half on page 1 and scroll the other
// to page 12 to compare. On a narrow (mobile-sized) window the right pane
// hides itself via CSS and the left pane just fills the window as before.
function openPdfViewer(title, url){
  const w = window.open('', '_blank');
  if(!w){ alert('Please allow pop-ups to view the document.'); return; }
  w.document.title = title || 'Document';
  const style = w.document.createElement('style');
  style.textContent = `
    html, body{height:100%; margin:0;}
    body{font-family:system-ui,-apple-system,sans-serif; background:#1E2233;}
    .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 16px; background:#2A2E42; color:#fff; font-size:13px;}
    .bar .hint{color:#B7BAD1; font-size:11.5px;}
    .panes{display:flex; height:calc(100% - 37px);}
    .pane{flex:1; min-width:0;}
    .pane iframe{display:block; width:100%; height:100%; border:0;}
    .pane.right{border-left:2px solid #1E2233;}
    @media (max-width: 860px){
      .pane.right{display:none;}
      .bar .hint{display:none;}
    }
  `;
  w.document.head.appendChild(style);
  w.document.body.innerHTML = `
    <div class="bar"><strong>${escapeHtml(title || 'Document')}</strong><span class="hint">Side-by-side view — each half scrolls independently</span></div>
    <div class="panes">
      <div class="pane left"><iframe src="${url}"></iframe></div>
      <div class="pane right"><iframe src="${url}"></iframe></div>
    </div>
  `;
}

/* ---------------- Approval certificate (printable proof) ---------------- */
// Pre-uploaded signature images live at signatures/{uid}.png, dropped in by
// the admin via the console — there's no upload UI for these. A user with no
// file there yet is a normal, expected case, not an error: fall back to null
// so the certificate just renders a blank line for them, same as before.
async function fetchSignatureDataUrl(uid){
  if(!uid) return null;
  try {
    const bytes = await getBytes(storageRef(storage, `signatures/${uid}.png`));
    return `data:image/png;base64,${b64(bytes)}`;
  } catch(err){
    return null;
  }
}

async function showCertificate(docId){
  const item = [...myUploads, ...decidedByMe].find(x => x.id === docId);
  if(!item || item.status !== 'approved') return;

  const approvedDate = item.decidedAt && typeof item.decidedAt.toDate === 'function'
    ? item.decidedAt.toDate().toLocaleString() : '—';

  // Built via DOM APIs rather than a document.write() string: a raw string
  // containing a literal closing-body tag is exactly what a dev-reload tool
  // like Live Server naively string-matches to splice its own <script> into —
  // right in the middle of *our* module script if that string sits in this
  // file. Assigning to the popup's own head/body sidesteps that entirely.
  // Sized for a half-Quarto sheet (203mm x 127mm, i.e. Quarto cut across the
  // shorter way) since that's what gets handed to an on-site superior; kept
  // deliberately sparse for a glance-and-done read.
  const style = `
    body{font-family:Arial,Helvetica,system-ui,sans-serif; background:#EDEEF3; margin:0; padding:28px 20px; color:#161821;}
    .sheet{max-width:460px; margin:0 auto; background:#fff; padding:30px 34px;}
    .org{font-size:10.5px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:#6B6E80;}
    .doctype{font-size:10.5px; color:#9195A8; margin-top:1px;}
    .title-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:18px 0 18px;}
    h1{font-size:17px; margin:0; font-weight:700; line-height:1.3;}
    .status-pill{font-size:10px; font-weight:800; letter-spacing:.5px; padding:2px 8px; background:#FCEE7A; color:#3A3D4D; white-space:nowrap;}
    .meta div{font-size:13.5px; line-height:2;}
    .meta .label{display:inline-block; width:100px; color:#6B6E80;}
    .meta .value{font-weight:600;}
    .actions{max-width:460px; margin:16px auto 0; text-align:center;}
    .actions button{font:inherit; font-size:13px; padding:8px 18px; background:#5B5FEF; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;}
    @page{ size: 203mm 127mm; margin: 8mm; }
    @media print{ body{background:#fff; padding:0;} .actions{display:none;} }
  `;
  const bodyHtml = `
    <div class="sheet">
      <div class="org">DOCUMENT APPROVALS</div>
      <div class="doctype">Approval Certificate</div>

      <div class="title-row">
        <h1>${escapeHtml(item.title)}</h1>
        <span class="status-pill">APPROVED</span>
      </div>

      <div class="meta">
        <div><span class="label">Submitted by</span><span class="value">${escapeHtml(item.uploadedByName)}</span></div>
        <div><span class="label">Approved by</span><span class="value">${escapeHtml(item.approverName)}</span></div>
        <div><span class="label">Approved on</span><span class="value">${escapeHtml(approvedDate)}</span></div>
      </div>
    </div>
    <div class="actions"><button type="button" id="certPrintBtn">Print / Save as PDF</button></div>
  `;

  const w = window.open('', '_blank');
  if(!w){ alert('Please allow pop-ups to view the certificate.'); return; }
  w.document.title = `Certificate of Approval — ${item.title}`;
  const styleEl = w.document.createElement('style');
  styleEl.textContent = style;
  w.document.head.appendChild(styleEl);
  w.document.body.innerHTML = bodyHtml;
  w.document.getElementById('certPrintBtn').onclick = () => w.print();
}

/* ---------------- Rendering ---------------- */
function render(){
  if(!currentUser){
    el.innerHTML = `
      <div class="wrap">
        <header><h1>Document Approvals</h1></header>
        <div class="card">
          <h2>Sign in</h2>
          ${loginError ? `<div class="error">${loginError}</div>` : ''}
          <form id="loginForm">
            <label for="l-email">Email</label>
            <input type="email" id="l-email" required autocomplete="username">
            <label for="l-pass">Password</label>
            <input type="password" id="l-pass" required autocomplete="current-password">
            <button class="btn" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    `;
    document.getElementById('loginForm').onsubmit = e => {
      e.preventDefault();
      doLogin(document.getElementById('l-email').value.trim(), document.getElementById('l-pass').value);
    };
    return;
  }

  if(!profile){ el.innerHTML = `<div class="wrap">Loading your account…</div>`; return; }

  const upload = canUpload(), approve = canApprove();

  el.innerHTML = `
    <div class="wrap">
      <header>
        <div>
          <h1>Document Approvals</h1>
          <div class="who">${profile.name} · ${currentUser.email}</div>
          <div class="badges">
            <span class="badge ${upload?'on':''}">Upload</span>
            <span class="badge ${approve?'on':''}">Approve</span>
          </div>
        </div>
        <button class="btn secondary small" id="logoutBtn">Sign out</button>
      </header>

      ${upload ? renderUploadCard() : ''}
      ${upload ? renderMyUploadsCard() : ''}
      ${approve ? renderPendingCard() : ''}
      ${approve ? renderDecidedCard() : ''}
      ${!upload && !approve ? `<div class="card"><div class="empty">Your account doesn't have upload or approve access yet. Contact your admin.</div></div>` : ''}
    </div>
  `;

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = doLogout;

  const uploadForm = document.getElementById('uploadForm');
  if(uploadForm) uploadForm.onsubmit = handleUpload;

  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    const id = b.getAttribute('data-view');
    const item = [...pendingApprovals, ...decidedByMe, ...myUploads].find(x => x.id === id);
    if(item) viewDocument(id, item);
  });
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => decide(b.getAttribute('data-approve'), 'approved'));
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => decide(b.getAttribute('data-reject'), 'rejected'));
  document.querySelectorAll('[data-cert]').forEach(b => b.onclick = () => showCertificate(b.getAttribute('data-cert')));
}

function renderUploadCard(){
  return `
    <div class="card">
      <h2>Upload a document</h2>
      <form id="uploadForm">
        <label for="u-title">Title</label>
        <input type="text" id="u-title" placeholder="e.g. Client contract — Acme Corp">
        <label for="u-file">PDF file</label>
        <input type="file" id="u-file" accept="application/pdf" required>
        <label for="u-approver">Approver</label>
        <select id="u-approver" required>
          <option value="">Choose an approver</option>
          ${approvers.map(a => `<option value="${a.uid}">${a.name}</option>`).join('')}
        </select>
        <label for="u-pass">Passphrase (optional)</label>
        <input type="password" id="u-pass" placeholder="Leave blank to send unencrypted">
        <div class="hint">Set a passphrase to encrypt the file in your browser before it leaves your device — then send the passphrase to your approver a different way than the file (a text message or a call, not the same email thread). Leave it blank to send the file without encryption.</div>
        <button class="btn" type="submit">Send for approval</button>
      </form>
      <div class="status-line">${statusLine}</div>
    </div>
  `;
}

function renderMyUploadsCard(){
  return `
    <div class="card">
      <h2>My uploads</h2>
      ${myUploads.length ? myUploads.map(d => `
        <div class="item">
          <div class="meta"><div class="t">${escapeHtml(d.title)}</div><div class="s">to ${escapeHtml(d.approverName)}${d.comment ? ` — “${escapeHtml(d.comment)}”` : ''}</div></div>
          <span class="tag ${d.status}">${d.status}</span>
          ${d.status === 'approved' ? `<button class="btn secondary small" data-cert="${d.id}">Certificate</button>` : ''}
        </div>
      `).join('') : `<div class="empty">Nothing uploaded yet.</div>`}
    </div>
  `;
}

function renderPendingCard(){
  return `
    <div class="card">
      <h2>Waiting on you</h2>
      ${pendingApprovals.length ? pendingApprovals.map(d => `
        <div class="item">
          <div class="meta"><div class="t">${escapeHtml(d.title)}</div><div class="s">from ${escapeHtml(d.uploadedByName)} · ${d.sizeKB} KB</div></div>
          <button class="btn secondary small" data-view="${d.id}">View</button>
          <button class="btn approve small" data-approve="${d.id}">Approve</button>
          <button class="btn reject small" data-reject="${d.id}">Reject</button>
        </div>
      `).join('') : `<div class="empty">Nothing needs your review right now.</div>`}
    </div>
  `;
}

function renderDecidedCard(){
  return `
    <div class="card">
      <h2>Your past decisions</h2>
      ${decidedByMe.length ? decidedByMe.map(d => `
        <div class="item">
          <div class="meta"><div class="t">${escapeHtml(d.title)}</div><div class="s">from ${escapeHtml(d.uploadedByName)}</div></div>
          <span class="tag ${d.status}">${d.status}</span>
          ${d.status === 'approved' ? `<button class="btn secondary small" data-cert="${d.id}">Certificate</button>` : ''}
        </div>
      `).join('') : `<div class="empty">No decisions yet.</div>`}
    </div>
  `;
}

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

render();
</script>
</body>
</html>
